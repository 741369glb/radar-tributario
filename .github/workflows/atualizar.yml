name: Atualizar Radar Tributário

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 9h UTC = 6h da manhã em Brasília
  workflow_dispatch:       # permite rodar na hora pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coletar e analisar as novidades
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python coletor.py

      - name: Salvar no site
        run: |
          git config user.name "radar-tributario-bot"
          git config user.email "radar-tributario-bot@users.noreply.github.com"
          git add docs/dados.json
          git diff --staged --quiet || git commit -m "Atualização diária $(date +%F)"
          git push
